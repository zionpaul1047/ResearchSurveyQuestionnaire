spring:
  application:
    name: research-survey-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/research_survey}
    username: ${SPRING_DATASOURCE_USERNAME:survey_app}
    password: ${SPRING_DATASOURCE_PASSWORD:survey_password}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: ${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:10MB}
      max-request-size: ${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:10MB}

server:
  port: 8080
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

survey:
  upload-directory: ${SURVEY_UPLOAD_DIRECTORY:./uploads}
  admin:
    username: ${SURVEY_ADMIN_USERNAME:admin}
    password: ${SURVEY_ADMIN_PASSWORD:change-me-before-production}
  analyst:
    username: ${SURVEY_ANALYST_USERNAME:analyst}
    password: ${SURVEY_ANALYST_PASSWORD:change-me-before-production}
  analytics:
    minimum-group-size: ${SURVEY_ANALYTICS_MIN_GROUP_SIZE:5}
  cors:
    allowed-origins: ${SURVEY_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
